<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客 · 琉璃</title>
<meta name="description" content="琉璃的博客：折腾过程中的笔记与思考。">
<meta name="theme-color" content="#0a192f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a192f'/%3E%3Ctext x='32' y='45' font-family='monospace' font-size='36' font-weight='bold' fill='%2364ffda' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo mono">琉璃<span class="logo-cursor">_</span></a>
    <nav class="nav-links">
      <a href="/">主页</a>
      <a href="/#projects">项目</a>
      <a href="/#contact">联系</a>
    </nav>
  </div>
</header>

<main>
  <section class="section" style="padding-top: 140px;">
    <div class="section-inner">
      <h2 class="section-title"><span class="title-num mono">✎</span>全部文章</h2>
      <p class="section-desc">折腾过程中的笔记与思考，共 <span id="postCount" class="mono">0</span> 篇</p>
      <div class="post-list" id="postList"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <p class="mono">© <span id="year">2026</span> 琉璃 · 手写 HTML/CSS/JS</p>
</footer>

<script src="js/posts.js"></script>
<script src="js/blog.js"></script>
<script>
  // 列表渲染由 blog.js 自动完成，这里补一个文章计数
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('postCount').textContent = (window.POSTS || []).length;
    document.getElementById('year').textContent = new Date().getFullYear();
  });
</script>
</body>
</html>
